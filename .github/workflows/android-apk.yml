name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Java 17 (Direct Linux Package)
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Build with Gradle
      run: |
        echo "=== Ищем файл gradlew в репозитории ==="
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Ошибка: Скрипт gradlew не найден! Проверяем структуру папок:"
          ls -R
          exit 1
        fi
        
        echo "Файл найден по пути: $GRADLEW_PATH"
        cd $(dirname "$GRADLEW_PATH")
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tg-proxy-helper-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
